name: Build Executables (Windows & Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          python build_exe.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: SwiffyGiffy-windows-x64
          path: dist/SwiffyGiffy.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y file libfuse2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Standalone Executable & Desktop Bundle
        run: |
          python build_exe.py

      - name: Build AppImage (Ubuntu / Linux Mint)
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload Linux AppImage & Tarball Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SwiffyGiffy-linux-x86_64
          path: |
            dist/SwiffyGiffy-x86_64.AppImage
            dist/SwiffyGiffy-linux-x86_64.tar.gz
            dist/SwiffyGiffy

